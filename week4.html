<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hover Animation</title>

    <style>
        .wrapper {
            width: 300px;
            height: 300px;
            margin: auto;
            position: relative;
            border: 8px solid black;
            background-image: url("JuiceXRimac.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .box {
            width: 50px;
            height: 50px;
            position: absolute;
            right: 50%;
            bottom: 50%;
            background-color: rgb(96, 121, 246);
            transform: translate(50%, 50%);
            transition: background-color 0.3s ease 0.3s, transform 1s ease;
        }

        .box:hover {
            background-color: rgb(212, 0, 0);
            transform: translate(50%, 50%) scale(1.1) rotate(360deg);
        }

        @media (min-width: 700px) {
            .wrapper {
                width: 300px;
                height: 300px;
                border: 3px solid rgb(237, 234, 234);
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="box"></div>
    </div>
</body>
</html>
