<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen</title>
    <style>
        body {
            font-size: 16px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* Media queries for tablet */
        @media (min-width: 768px) {
            body {
                font-size: 14px;
                color: red;
            }

            
            .image-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 24px;
            }
        }

        /* Media queries for desktop */
        @media (min-width: 1200px) {
            body {
                font-size: 18px;
                color: blue;
            }

            .image-container {
                grid-template-columns: repeat(4, 1fr);
            }

        }
    </style>
</head>

<body>
    Lorem ipsum dolor sit amet consectetur, adipisicing elit. Rerum, quibusdam. Laborum nam quod consequuntur ex
    voluptatem itaque voluptate quibusdam eius nostrum reiciendis? Ducimus in molestias, corporis dolorem velit aliquid
    iste!
    <h1>Screen</h1>
    <p>This is a sample screen page.</p>

    <div class="image-container">
        <img src="download.jpg" alt="Screen Image">
        <img src="shot.jpg" alt="Screen Image 2">
        <img src="real.jpg" alt="Screen Image 3">
        <img src="port.jpg" alt="Screen Image 4">
    </div>

</body>

</html>
