<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Transition</title>

    <style>
        img {
            width: 400px;
            height: 250px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        img:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <h2>Transition Properties with Image</h2>

    <img src="flower.jpg" alt="Flower">
</body>
</html>
